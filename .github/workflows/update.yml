name: Update ONI chat pages

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: oni-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pages from Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          mkdir -p scripts docs
          [ -f scripts/build.py ] || cp build.py scripts/build.py
          touch docs/.nojekyll
          python scripts/build.py

      - name: Save data
        run: |
          git config user.name "oni-bot"
          git config user.email "oni-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "update $(date -u +%FT%TZ)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy (retry)
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Schedule next run (about 5 minutes later)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 240
          gh workflow run update.yml --repo "${{ github.repository }}" --ref main
